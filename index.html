<body>
<header class="hero">
  <div class="brandline"><span class="logo">M</span>MAGNET · Sticle de protecție</div>
  <h1>Ce sticlă s-ar potrivi <em>telefonului?</em></h1>
  <p>Scrie numele modelului sau textul de pe telefon ori de pe cutie.</p>
  <div class="search-row">
  <div class="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="ex: SM-G988B, A13, Note 13 Pro, iPhone 13" autocomplete="off" aria-label="Caută model sau cod">
  </div>
  </div>
  <div class="chips" id="brands"></div>
  <nav class="tabs" role="tablist" aria-label="Secțiuni catalog">
    <button id="t-cauta" role="tab" aria-controls="main" aria-selected="true" tabindex="0">Caută model</button>
    <button id="t-noi" role="tab" aria-controls="main" aria-selected="false" tabindex="-1">Modele noi</button>
    <button id="t-sticle" role="tab" aria-controls="main" aria-selected="false" tabindex="-1">Sticle confirmate</button>
    <button id="t-info" role="tab" aria-controls="main" aria-selected="false" tabindex="-1">Cum se citește</button>
  </nav>
</header>
<main id="main" role="tabpanel" tabindex="0" aria-labelledby="t-cauta" aria-busy="true"><p class="hint" role="status">Se încarcă lista de modele…</p></main>
<div id="tip"><div class="cvt">⚠ ECRAN CURBAT — doar sticlă 3D / UV</div><div class="st"><img alt=""></div><b></b><small></small><div class="cl"></div></div>
