name: Sync phone database into site

on:
  push:
    branches: [main]
    paths:
      - "data.json"
      - "data/phone-images.json"
      - "scripts/sync_embedded_data.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync and validate the database
        run: |
          python scripts/sync_embedded_data.py
          python scripts/validate_project.py

      - name: Commit generated site data when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Site data already matches the database."
          else
            git commit -m "Sync phone database into site"
            git push origin main
          fi
